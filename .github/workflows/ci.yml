name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Rodar testes
        run: mvn --batch-mode --no-transfer-progress test

      - name: Empacotar (sem rodar os testes de novo)
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Rodar testes
        run: npx ng test --watch=false

      - name: Build de producao
        run: npx ng build

  e2e:
    name: E2E (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: facilitei
          POSTGRES_USER: facilitei
          POSTGRES_PASSWORD: facilitei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facilitei -d facilitei"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Subir o backend em background
        working-directory: backend
        run: |
          nohup mvn --batch-mode --no-transfer-progress spring-boot:run > ../backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend no ar."
              exit 0
            fi
            sleep 2
          done
          echo "Backend nao subiu a tempo:"
          cat ../backend.log
          exit 1

      - name: Instalar dependencias do frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar dependencias do e2e
        working-directory: e2e
        run: npm ci

      - name: Instalar navegadores do Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Rodar suite E2E
        working-directory: e2e
        run: npm test

      - name: Publicar relatorio do Playwright (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            backend.log
          retention-days: 7
